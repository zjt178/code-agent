[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent"
version = "0.1.0"
description = "代码仓库静态分析 Agent：AST 索引 + 混合检索 + 缺陷识别 + 测试生成 + 静态自检"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "faiss-cpu>=1.8",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "GitPython>=3.1",
  "pydantic>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codeagent = "codeagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
